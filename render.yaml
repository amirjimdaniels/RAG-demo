services:
  - type: web
    name: rag-demo
    env: docker
    # Path to the Docker build context and Dockerfile relative to the repo root
    dockerContext: RAG
    dockerfilePath: RAG/Dockerfile
    # Render automatically injects the PORT environment variable
    envVars:
      # Embedding / retrieval settings (non-secret — safe to commit defaults)
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_QUERY_PREFIX
        value: ""
      - key: RERANKER_ENABLED
        value: "true"
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      # LLM API keys — set these in the Render dashboard, never commit values here
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
